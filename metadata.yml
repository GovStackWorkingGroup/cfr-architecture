name: GovStack Architecture
abstract: |
  The GovStack Architecture is a Reference Architecture that defines the structural and technical constraints and decisions that shape a system's overall design to achieve technical **interoperability**: the ability for different autonomous systems and Building Blocks to collaborate and provide an ecosystem of value.
